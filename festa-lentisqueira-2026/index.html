<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festa da Lentisqueira 2026</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎉 Festa da Lentisqueira 2026 🎉</h1>

      <div class="header-with-logo">
        <img src="logo.png" alt="Logo ACDL" class="logo" />
        <h3>Organizado pela Associação Cultural e Desportiva da Lentisqueira</h3>
      </div>

      <!-- Live Clock -->
      <div id="live-clock" class="live-clock"></div>

      <!-- Recording Mode Toggle -->
      <div class="recording-controls">
        <label class="toggle-container">
          <span class="toggle-label">Modo de Gravação</span>
          <input type="checkbox" id="recording-toggle" class="toggle-checkbox" />
          <span class="toggle-switch"></span>
        </label>
      </div>

      <!-- Recording Indicator -->
      <div id="recording-indicator" class="recording-indicator hidden">
        🔴 REC MODE
      </div>

      <!-- Winners Summary: always shows all 3 contests' status -->
      <div id="winners-summary" class="winners-summary"></div>

      <!-- Contest Carousel: one contest's controls visible at a time -->
      <div class="carousel">
        <button id="carousel-prev" class="carousel-nav-btn" aria-label="Contest anterior">&lsaquo;</button>
        <div id="contests-container" class="carousel-viewport"></div>
        <button id="carousel-next" class="carousel-nav-btn" aria-label="Contest seguinte">&rsaquo;</button>
      </div>

      <div id="winner-modal" class="modal">
        <div class="modal-content">
          <span class="close-button" id="modal-close">&times;</span>
          <h2>Temos Vencedor! 🎉</h2>
          <div class="winning-ticket" id="modal-ticket">#---</div>
          <div class="winning-name" id="modal-name">Nome do Comprador</div>
          <div class="prize-won" id="modal-prize">---</div>
        </div>
      </div>
    </div>

    <script type="module" src="raffle.js"></script>
  </body>
</html>
